name: Release Please
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag written with GITHUB_TOKEN does not fire `on: push`, so the release asks for the
  # image explicitly. workflow_dispatch is the documented exception to that rule, and the
  # dispatch runs at the new tag, which is what decides the published tags.
  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
