# PostgreSQL for local development. The Gateway runs on the host with `pnpm dev`.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: elos
      POSTGRES_USER: elos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm run setup first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U elos -d elos']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
