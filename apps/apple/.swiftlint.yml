included:
  - ElosAgent
  - Packages/ElosKit/Sources
  - Packages/ElosKit/Tests

excluded:
  - Packages/ElosKit/.build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

# An exhaustive switch over HTTP statuses is the point, not accidental branching.
cyclomatic_complexity:
  ignores_case_statements: true

disabled_rules:
  # The gateway's own naming is mirrored here; renaming for length would hide the mapping.
  - todo

line_length:
  warning: 110
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 2

# Test fixtures spell out whole API payloads; that length is the point.
file_length:
  warning: 400

force_unwrapping:
  severity: warning
